# agent-boot — the can's internals.
#
# WHAT THIS DEMONSTRATES, AND WHAT IT DELIBERATELY DOES NOT
# ---------------------------------------------------------
# agent-boot itself has NO runtime dependencies — pure standard library. So this compose is not
# here to install it; it is here to show the one structural idea that makes a containerised agent
# work at all:
#
#     THE IMAGE IS THE VESSEL. THE MOUNTS ARE THE BEING.
#
# The image carries code and doctrine templates. It carries NO secrets, NO memory and NO local
# rules. Everything that makes a particular agent *that* agent is mounted in at runtime, which is
# what lets one image serve every seat and lets a seat survive being rebuilt.
#
# Three mounts, three jobs:
#
#   ~/.claude      settings.json (the three hook layers) + memory namespace   rw — it writes here
#   ~/.agentboot   nag.md · nag-terse.md · tattoo.md — the operator's own      rw — the tattoo is live state
#   tools.d/       JSON manifests declaring what THIS environment offers      ro — discovery input
#
# The third is the interesting one. The image cannot know that this particular seat has a vector
# store, or a credential CLI, or a browser grid. Hardcoding those makes the image unportable, and
# omitting them makes the agent blind to its own environment. So the environment DECLARES them in
# tools.d and the boot DISCOVERS them — and then probes every one before letting the agent believe
# it has them (see agentboot/tools.py).
#
# There are no sidecars here on purpose. A compose full of services that this repo does not need
# would be aspirational, and an aspirational compose is a lie that takes an afternoon to discover.
# Add your own; the discovery contract is the JSON manifest, not a service name.

services:
  agent:
    build: .
    image: agent-boot:0.2.0
    container_name: agent-boot
    init: true
    restart: unless-stopped

    environment:
      # os.pathsep-separated manifest paths, read at boot by ToolRegistry.discover().
      AGENTBOOT_TOOLS: /run/tools.d/environment.json
      CLAUDE_DIR: /home/agent/.claude
      AGENTBOOT_DIR: /home/agent/.agentboot
      # ONE session, and it IS the main loop. A second is a second AGENT writing the same running
      # thread - a split brain with no merge. Bounded side-work goes to a minion instead.
      AGENT_SESSION: main
      # What the layout actually runs inside that session.
      AGENT_MAIN_LOOP: bash
      ZELLIJ_CONFIG_DIR: /home/agent/.agentboot/zellij
      # The KEYED tier: ~1ms find-by-key, no embedder, no model involved.
      AGENT_MONGO_URL: mongodb://mongo:27017
      AGENT_MONGO_DB: agent
      # The browser terminal starts ONLY if a credential is supplied. Set it in an env file, never
      # here - a password in a committed compose is a password in the repo's history forever.
      # AGENT_WEB_CREDENTIAL: user:password    <- via `docker compose --env-file`
      AGENT_WEB_WRITABLE: "false"

    depends_on:
      mongo:
        condition: service_healthy

    volumes:
      # --- the being: mounted, never baked ---
      - ${AGENT_STATE:-./state}/claude:/home/agent/.claude:rw
      - ${AGENT_STATE:-./state}/agentboot:/home/agent/.agentboot:rw
      # --- what this environment offers (read-only: the agent discovers, it does not edit) ---
      - ./tools.d:/run/tools.d:ro

    ports:
      - "${AGENT_WEB_PORT:-7681}:7681"

  # ── the KEYED tier ────────────────────────────────────────────────────────────────────────────
  # Deterministic recall: expand this crumb, what is X, what did I do in session S. A find-by-key,
  # ~1ms, no embedding and no model in the path.
  #
  # NOT A VECTOR STORE, and it must not become one. Community MongoDB has no ANN index. The
  # temptation is real because it is the database already sitting there; putting semantic search
  # here produces something that answers slowly and confidently with the wrong neighbour.
  mongo:
    image: mongo:7
    container_name: agent-mongo
    restart: unless-stopped
    volumes:
      # STATE IS THE BEING. The vessel rebuilds from a Dockerfile; this does not rebuild from
      # anything. Back it up OFF this box.
      - agent_state:/data/db
    healthcheck:
      # Speak the protocol. A port being open says nothing about whether the database answers.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  agent_state:      # his keyed memory — unversioned BEING, not vessel

    # The agent runs INSIDE a named multiplexer session, not as this container's foreground process.
    # That is what makes it detach-survivable: closing your terminal, dropping the VPN, or rebooting
    # YOUR machine are not events in its life. See agentboot/session.py.
    #
    # Order matters. Prove the hooks fire BEFORE holding the session open - a container that comes up
    # attachable but with no enforcement is a body with no mind, and it looks perfectly healthy.
    command:
      - bash
      - -lc
      - |
        set -e
        python3 -m agentboot install --prove
        exec zellij --layout /opt/agent-boot/examples/zellij/main.kdl --session "${AGENT_SESSION:-main}"

    healthcheck:
      # Two different claims, and both are required:
      #   verify  - the hooks still EXECUTE and emit their markers (configured is not working)
      #   attach  - the holding session is LIVE, not merely listed (an exited session still prints)
      test: ["CMD-SHELL",
             "python3 -m agentboot verify && python3 -m agentboot attach --session ${AGENT_SESSION:-main}"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 15s

# REACHING IT - one session, four addresses. The way in is interchangeable precisely because the
# agent does not depend on any of them:
#
#   local     docker exec -it agent-boot zellij attach main
#   remote    ssh -t <host> docker exec -it agent-boot zellij attach main
#   render    python3 -m agentboot attach --session main --host <host> --container agent-boot
#
# The -t / -it is NOT optional. Without a forced TTY the attach renders unusable garbage, which reads
# as "the agent is broken" when the agent is fine and you simply did not give it a terminal.
#
# The state directory is a bind mount by default so it is trivially backup-able and inspectable
# from the host. Point AGENT_STATE at a real backed-up path in production — the tattoo and the
# memory namespace live there, and they are the only things that cannot be rebuilt.
