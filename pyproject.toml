# gandalf-core — portable operating framework for long-running AI agent instances.
# pyproject.toml is the canonical VERSION source and holds the lint config the
# central `validate` gate honours (ruff + pydocstyle, via forge-workflows).
[project]
name = "gandalf-core"
version = "0.1.0"          # 0.x.y = pre-production; bump to 1.0.0 when it goes to production
description = "A portable operating framework — a forest of always-on background daemons — for long-running AI agents."
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# E701/E702 (multiple statements per line) are the deliberate, compact house style
# of these ported daemon scripts (port/*.py) — dense one-liners are intentional, not
# accidental. Ignore them; every other default rule (imports, bare-except, pyflakes)
# stays enforced.
ignore = ["E701", "E702"]

[tool.pydocstyle]
convention = "pep257"
