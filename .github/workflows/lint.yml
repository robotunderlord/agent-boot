# ══════════════════════════════════════════════════════════════════════════════
# lint — "Lint"
# ══════════════════════════════════════════════════════════════════════════════
# Public repo, github-hosted. Runs ruff + pydocstyle on every push so the badge
# reflects the tree anyone can clone. agent-boot has no runtime dependencies, so
# there is nothing to install but the linters themselves.
name: lint
run-name: "Lint"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: agent-boot-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install --quiet ruff pydocstyle

      - name: ruff
        run: ruff check .

      - name: pydocstyle
        run: pydocstyle --convention=pep257 agentboot/ port/

      - name: self-test - the boot must refuse to fake a pass
        run: python3 -m unittest discover -s tests -v
